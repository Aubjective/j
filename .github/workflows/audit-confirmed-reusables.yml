name: Audit Confirmed Reusables

on:
  push:
    paths:
      - '.github/workflows/audit-confirmed-reusables.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update confirmed reusable mechanics and runtime
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          # Mechanics registry
          p = Path('data/mechanics.json')
          data = json.loads(p.read_text())
          data['version'] = max(int(data.get('version', 0)), 16) + 1
          defs = data.setdefault('effectDefinitions', {})

          # Re-assert the two confirmed stack mechanics.
          sg = defs.setdefault('Stack Guard', {})
          sg.update({
              'skillUnit':'Buff','effect':'Guard','termKey':'mechanic.stackGuard','localisationKey':'StackGuardXDescr',
              'mechanicConfirmed':True,'confirmationSource':'live+sheet+localisation','clickable':True,
              'templateKey':'stackGuard','templateArgs':{'basePercent':'directDamageReductionPercent','upgradePercent':'upgradeDirectDamageReductionPercent','decayPercent':'effectivenessDecayPercentPerHit'},
              'maxStacks':1,'upgradeMaxStacks':1,'triggerAt':'GotAttacked','decreaseAt':'GotAttacked','removedAt':'GotAttacked',
              'directDamageReductionPercent':30,'upgradeDirectDamageReductionPercent':40,'effectivenessDecayPercentPerHit':10
          })
          sc = defs.setdefault('Stack Charge', {})
          sc.update({
              'skillUnit':'Buff','effect':'Charge','termKey':'mechanic.stackCharge','localisationKey':'StackChargeXDescr',
              'mechanicConfirmed':True,'confirmationSource':'live+sheet+localisation','clickable':True,
              'templateKey':'stackCharge','templateArgs':{'basePercent':'nextDamageIncreasePercent','decayPercent':'effectDecreasePercentPerUse','upgradePercent':'upgradeNextDamageIncreasePercent'},
              'maxStacks':1,'upgradeMaxStacks':1,'triggerAt':'AttackEffect','decreaseAt':'AttackEffect','removedAt':'AttackEffect',
              'nextDamageIncreasePercent':50,'effectDecreasePercentPerUse':25,'upgradeNextDamageIncreasePercent':75
          })

          # Confirmed Apply-tag mechanics are explicitly tagged for exact parenthesized click matching.
          for name in ('Exhaust','Steal'):
              if name in defs:
                  defs[name]['family'] = 'Apply Tag'
                  defs[name]['applyTag'] = True
                  defs[name]['clickable'] = True

          defs['Food'] = {
              'family':'Apply Tag','applyTag':True,'skillUnit':'ApplyOn','effect':'Food',
              'termKey':'mechanic.food','localisationKey':'FoodDescr','mechanicConfirmed':True,
              'confirmationSource':'live+sheet+localisation','clickable':True,'templateKey':'food',
              'includesExhaust':True,'badMoodStacksReduction':'half','triggerAt':'AfterAction'
          }
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          # Mechanics localization
          p = Path('data/mechanics_localisation.json')
          loc = json.loads(p.read_text())
          loc['version'] = max(int(loc.get('version', 0)), 14) + 1
          vals = {
            'en': {
              'term':'Food','stackCharge':'Stack Charge',
              'food': 'This skill has [Exhaust] effect. Reduce your Bad Mood debuff stacks by half upon use.',
              'stackChargeDescr':'Increase the next damage dealt by {basePercent}%, decrease the effect by {decayPercent}% for each use. ({upgradePercent}% if upgraded).'
            },
            'zh-CN': {
              'term':'食物','stackCharge':'叠加蓄力',
              'food':'这个技能有【除外】效果。使用此技能后，你的坏情绪叠加减半。',
              'stackChargeDescr':'下一击的伤害提升{basePercent}%, 每次触发减少{decayPercent}%效果。 (升级后{upgradePercent}% )'
            },
            'zh-TW': {
              'term':'食物','stackCharge':'疊加蓄力',
              'food':'這個技能有【除外】效果。使用此技能後，你的壞情緒疊加減半。',
              'stackChargeDescr':'下一擊的傷害提升{basePercent}%, 每次觸發減少{decayPercent}%效果。 (升級後{upgradePercent}% )'
            }
          }
          for lang, v in vals.items():
              block = loc.setdefault('locales', {}).setdefault(lang, {})
              terms = block.setdefault('terms', {})
              names = block.setdefault('mechanicNames', {})
              templates = block.setdefault('templates', {})
              terms['mechanic.food'] = v['term']
              terms['mechanic.stackCharge'] = v['stackCharge']
              names['Food'] = v['term']
              names['Stack Charge'] = v['stackCharge']
              templates['food'] = v['food']
              templates['stackCharge'] = v['stackChargeDescr']
          p.write_text(json.dumps(loc, ensure_ascii=False, indent=2) + '\n')

          # Delivery patterns: make confirmed Reflect/Counter families live-ready.
          p = Path('data/delivery_patterns.json')
          d = json.loads(p.read_text())
          d['version'] = max(int(d.get('version', 0)), 5) + 1
          fam = d.setdefault('families', {})
          fam['debuffCounter'] = {
              'effects': {'Bleed':'bleed','Injury':'injury','Venom':'venom','Restrain':'restrain','Insane':'insane'},
              'rules': [{'kind':'passive','skillUnit':'Reflect','template':'counterDebuffOnDamage'}]
          }
          names = {
              'en': {'bleed':'Bleed','injury':'Injury','venom':'Venom','restrain':'Restrain','insane':'Insane'},
              'zh-CN': {'bleed':'出血','injury':'受伤','venom':'剧毒','restrain':'拘束','insane':'疯癫'},
              'zh-TW': {'bleed':'出血','injury':'受傷','venom':'劇毒','restrain':'拘束','insane':'瘋癲'}
          }
          templates = {
              'en':'When damaged by the opponent, apply {multiplier} {status} to the opponent.',
              'zh-CN':'当承受敌方攻击时, 对敌方施加{multiplier}个{status}。',
              'zh-TW':'當承受敵方攻擊時, 對敵方施加{multiplier}個{status}。'
          }
          reflect_templates = {
              'zh-CN':'当敌方对自身施加{status}时, 敌方也会被施加相同数量的{status}。',
              'zh-TW':'當敵方對自身施加{status}時, 敵方也會被施加相同數量的{status}。'
          }
          for lang in ('en','zh-CN','zh-TW'):
              block = d.setdefault('locales', {}).setdefault(lang, {})
              terms = block.setdefault('terms', {})
              for sid, label in names[lang].items(): terms[f'status.{sid}'] = label
              block.setdefault('templates', {})['counterDebuffOnDamage'] = templates[lang]
              if lang in reflect_templates:
                  block['templates']['reflectStatus'] = reflect_templates[lang]
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n')

          # Mechanics runtime: locale aliases + localized reusable element args.
          p = Path('mechanics.js')
          s = p.read_text()
          s = s.replace("if (raw === 'zh-cn' || raw === 'zh_hans' || raw === 'zh-hans' || raw === 'simplified chinese') return 'zh-CN';",
                        "if (raw === 'zh-cn' || raw === 'zh_hans' || raw === 'zh-hans' || raw === 'simplified chinese' || raw === 'chinese') return 'zh-CN';")
          s = s.replace("if (raw === 'zh-tw' || raw === 'zh_hant' || raw === 'zh-hant' || raw === 'traditional chinese') return 'zh-TW';",
                        "if (raw === 'zh-tw' || raw === 'zh_hant' || raw === 'zh-hant' || raw === 'traditional chinese' || raw === 'chinese (traditional)') return 'zh-TW';")
          old = """  function getReusableTemplateValues(definition) {\n    const values = {};\n    for (const [placeholder, sourceKey] of Object.entries(definition?.templateArgs || {})) {\n      values[placeholder] = getPath(definition, sourceKey);\n    }\n    return values;\n  }"""
          new = """  function getReusableTemplateValues(definition, locale) {\n    const values = {};\n    for (const [placeholder, sourceKey] of Object.entries(definition?.templateArgs || {})) {\n      let value = getPath(definition, sourceKey);\n      if (placeholder === 'element' && value != null) {\n        const id = normalizeElementId(value);\n        if (mechanicsData?.elementMechanics?.elements?.[id]) value = getElementLabel(id, locale);\n      }\n      values[placeholder] = value;\n    }\n    return values;\n  }"""
          if old in s: s = s.replace(old, new)
          s = s.replace('fillTemplate(template, getReusableTemplateValues(definition))', 'fillTemplate(template, getReusableTemplateValues(definition, locale))')
          p.write_text(s)

          # Delivery runtime locale aliases.
          p = Path('delivery-patterns.js')
          s = p.read_text()
          s = s.replace("if (raw === 'zh-cn' || raw === 'zh_hans' || raw === 'zh-hans' || raw === 'simplified chinese') return 'zh-CN';",
                        "if (raw === 'zh-cn' || raw === 'zh_hans' || raw === 'zh-hans' || raw === 'simplified chinese' || raw === 'chinese') return 'zh-CN';")
          s = s.replace("if (raw === 'zh-tw' || raw === 'zh_hant' || raw === 'zh-hant' || raw === 'traditional chinese') return 'zh-TW';",
                        "if (raw === 'zh-tw' || raw === 'zh_hant' || raw === 'zh-hant' || raw === 'traditional chinese' || raw === 'chinese (traditional)') return 'zh-TW';")
          p.write_text(s)

          # Wiki renderer: actually load delivery engine and make Apply-tag reusables exact candidates.
          p = Path('skill-description-wiki.js')
          s = p.read_text()
          old = """            await loadScriptOnce('skillunit.js', 'JobmaniaSkillUnit');\n            await loadScriptOnce('mechanics.js', 'JobmaniaMechanics');\n            if (window.JobmaniaMechanics?.load) {\n                await window.JobmaniaMechanics.load('data/mechanics.json');\n            }\n            return window.JobmaniaSkillUnit;"""
          new = """            await loadScriptOnce('skillunit.js', 'JobmaniaSkillUnit');\n            await loadScriptOnce('mechanics.js', 'JobmaniaMechanics');\n            if (window.JobmaniaMechanics?.load) {\n                await window.JobmaniaMechanics.load('data/mechanics.json');\n            }\n            await loadScriptOnce('delivery-patterns.js', 'JobmaniaDeliveryPatterns');\n            if (window.JobmaniaDeliveryPatterns?.load) {\n                await window.JobmaniaDeliveryPatterns.load('data/delivery_patterns.json');\n            }\n            return window.JobmaniaSkillUnit;"""
          if old not in s: raise SystemExit('ensureRuntime target not found')
          s = s.replace(old, new)
          old = """            if (text) candidates.push({ text, key: `mechanic.${name.toLowerCase().replace(/[^a-z0-9]+/g, '.')}`, kind: 'reusable', mechanicName: name, priority: 45 });"""
          new = """            if (text) {\n                const key = `mechanic.${name.toLowerCase().replace(/[^a-z0-9]+/g, '.')}`;\n                candidates.push({ text, key, kind: 'reusable', mechanicName: name, priority: 45 });\n                if (definition.applyTag || definition.family === 'Apply Tag') {\n                    candidates.push({ text: `(${text})`, key, kind: 'reusable', mechanicName: name, priority: 80 });\n                }\n            }"""
          if old not in s: raise SystemExit('candidate target not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mechanics.json data/mechanics_localisation.json data/delivery_patterns.json mechanics.js delivery-patterns.js skill-description-wiki.js
          git diff --cached --quiet && exit 0
          git commit -m 'Complete confirmed reusable mechanics wiring'
          git push
