name: Update confirmed mechanics

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update confirmed mechanics data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          # mechanics.json
          p = Path('data/mechanics.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          d['version'] = max(int(d.get('version', 0)), 14)
          defs = d.setdefault('effectDefinitions', {})
          defs['Bleed'] = {
              'skillUnit':'Debuff','effect':'Bleed','termKey':'mechanic.bleed','localisationKey':'BleedXDescr',
              'mechanicConfirmed':True,'confirmationSource':'live+sheet+localisation','clickable':True,
              'templateKey':'bleed','templateArgs':{'percent':'damagePercentPerStack','max':'maxStacks','upgradeMax':'upgradeMaxStacks'},
              'damagePercentPerStack':1,'damageBasedOn':'Max HP','triggerAt':'AfterAction','maxStacks':4,'upgradeMaxStacks':7,
              'decreaseAt':'TurnEnd','decreaseStacks':1
          }
          defs['Protect Pierce'] = {
              'skillUnit':'Vulnerable','effect':'Protect','termKey':'mechanic.protectPierce','localisationKey':'ProtectPierceXDescr',
              'mechanicConfirmed':True,'confirmationSource':'live+sheet+localisation','clickable':True,
              'templateKey':'protectPierce','templateArgs':{'piercePercent':'protectPiercePercentPerStack','invulnerableIncrease':'invulnerableDamageIncreasePerStack','max':'maxStacks'},
              'protectPiercePercentPerStack':5,'invulnerableDamageIncreasePerStack':3,'maxStacks':20,'upgradeMaxStacks':20,
              'triggerAt':'GotAttacked','removedAt':'TurnEnd'
          }
          defs['Steal'] = {
              'skillUnit':'ApplyOn','effect':'Steal','termKey':'mechanic.steal','localisationKey':'StealDescr',
              'mechanicConfirmed':True,'confirmationSource':'live+sheet+localisation','clickable':True,
              'templateKey':'steal','playerTrigger':'KillOpponent','enemyTrigger':'UseSkill',
              'currencies':['Dungeon Coins','Gold','Crystals'],'randomAmount':True,'enemyStealCannotBeRecovered':True
          }
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # mechanics_localisation.json
          p = Path('data/mechanics_localisation.json')
          loc = json.loads(p.read_text(encoding='utf-8'))
          loc['version'] = max(int(loc.get('version', 0)), 12)

          en = loc['locales']['en']
          en.setdefault('terms', {}).update({
              'mechanic.bleed':'Bleed','mechanic.protectPierce':'Protect Pierce','mechanic.steal':'Steal'
          })
          en.setdefault('mechanicNames', {}).update({
              'Bleed':'Bleed','Protect Pierce':'Protect Pierce','Steal':'Steal'
          })
          en.setdefault('templates', {}).update({
              'bleed':'After each action executed, suffer {percent}% damage based on Max HP for each stack. (Max {max}/upgrade {upgradeMax} stacks. Lose 1 stack at the end of turn)',
              'protectPierce':"For each stack, {piercePercent}% of the opponent's attack will pierce through Protect, and the damage received on Invulnerable buff will be increased by {invulnerableIncrease}. (Max {max} stacks. Removed at the end of turn)",
              'steal':"(Player) If this skill kills the opponent, gain random amount of dungeon coins, golds or crystals / (Enemy Monster) Steal random amount of dungeon coins, golds or crystals from the player (Can't be taken back)."
          })

          zc = loc['locales']['zh-CN']
          zc.setdefault('terms', {}).update({'mechanic.bleed':'出血','mechanic.protectPierce':'护甲贯通','mechanic.steal':'偷盗'})
          zc.setdefault('mechanicNames', {}).update({'Bleed':'出血','Protect Pierce':'护甲贯通','Steal':'偷盗'})
          zc.setdefault('templates', {}).update({
              'bleed':'每个行动的结束将受到基于Max HP {percent}%的伤害。(叠加上限{max} / 升级后{upgradeMax}。回合结束后失去1叠加数)',
              'protectPierce':'每层叠加, 敌方{piercePercent}%的攻击将会贯通自身的护甲, 并且无敌效果受到的伤害+{invulnerableIncrease}。(叠加上限{max}层。回合结束后消除)',
              'steal':'(玩家) 如果此技能是致命一击，获得任意数目的探险币，金币或水晶 / (敌人) 从玩家偷取随机数目的探险币，金币或水晶（不能夺回）。'
          })

          zt = loc['locales']['zh-TW']
          zt.setdefault('terms', {}).update({'mechanic.bleed':'出血','mechanic.protectPierce':'護甲貫通','mechanic.steal':'偷盜'})
          zt.setdefault('mechanicNames', {}).update({'Bleed':'出血','Protect Pierce':'護甲貫通','Steal':'偷盜'})
          zt.setdefault('templates', {}).update({
              'bleed':'每個行動的结束將受到基於Max HP {percent}%的傷害。 (疊加上限{max} / 升級後{upgradeMax}。回合结束後失去1疊加數)',
              'protectPierce':'每層疊加, 敵方{piercePercent}%的攻擊將會貫通自身的護甲, 並且無敵效果受到的傷害+{invulnerableIncrease}。(疊加上限{max}層。回合结束後消除)',
              'steal':'(玩家) 如果此技能是致命一擊，獲得任意數目的探險幣，金幣或水晶 / (敵人) 從玩家偷取隨機數目的探險幣，金幣或水晶（不能奪回）。'
          })
          p.write_text(json.dumps(loc, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # delivery_patterns.json: Bleed uses the same confirmed delivery family as elemental statuses.
          p = Path('data/delivery_patterns.json')
          dp = json.loads(p.read_text(encoding='utf-8'))
          dp['version'] = max(int(dp.get('version', 0)), 4)
          fam = dp.setdefault('families', {}).setdefault('bleedStatus', {})
          fam['effects'] = {'Bleed':'bleed'}
          fam['rules'] = [
              {'kind':'ability','skillUnit':'Debuff','template':'inflictOpponent'},
              {'kind':'ability','skillUnit':'Protect','template':'removeSelf'},
              {'kind':'ability','skillUnit':'Sacrifice','template':'gainSelf'},
              {'kind':'ability','skillUnit':'Curse','template':'gainStartOfTurn'},
              {'kind':'passive','skillUnit':'InstantNerf','template':'gainCombatStart'},
              {'kind':'passive','skillUnit':'TurnDebuff','template':'inflictEndOfTurn'},
              {'kind':'passive','skillUnit':'Reflect','template':'reflectStatus'},
              {'kind':'passive','skillUnit':'Protect','template':'immuneStatus'}
          ]
          for locale, name in [('en','Bleed'),('zh-CN','出血'),('zh-TW','出血')]:
              dp.setdefault('locales', {}).setdefault(locale, {}).setdefault('terms', {})['status.bleed'] = name
          p.write_text(json.dumps(dp, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit data changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mechanics.json data/mechanics_localisation.json data/delivery_patterns.json
          git commit -m "Add confirmed Bleed Protect Pierce and Steal mechanics"
          git push
