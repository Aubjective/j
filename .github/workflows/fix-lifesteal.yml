name: Fix Lifesteal mechanic

on:
  push:
    paths:
      - '.github/workflows/fix-lifesteal.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Split Lifesteal from Steal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          mp = Path('data/mechanics.json')
          data = json.loads(mp.read_text())
          data['version'] = max(int(data.get('version', 0)), 18)
          defs = data.setdefault('effectDefinitions', {})
          defs['Lifesteal'] = {
              'family': 'Apply Tag',
              'applyTag': True,
              'skillUnit': 'ApplyOn',
              'effect': 'LifeSteal',
              'termKey': 'mechanic.lifesteal',
              'localisationKey': 'LifeStealApplyXDescr',
              'mechanicConfirmed': True,
              'confirmationSource': 'live+sheet+localisation',
              'clickable': True,
              'templateKey': 'lifesteal',
              'templateArgs': {
                  'basePercent': 'healPercentOfDamageDealt',
                  'upgradePercent': 'upgradeHealPercentOfDamageDealt'
              },
              'healPercentOfDamageDealt': 50,
              'upgradeHealPercentOfDamageDealt': 100
          }
          # Keep Steal explicitly separate and correctly classified.
          if 'Steal' in defs:
              defs['Steal']['family'] = 'Apply Tag'
              defs['Steal']['applyTag'] = True
              defs['Steal']['effect'] = 'Steal'
              defs['Steal']['localisationKey'] = 'StealDescr'
          data.setdefault('applyTags', {})['LifeSteal'] = 'Lifesteal'
          data['applyTags']['Steal'] = 'Steal'
          mp.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          lp = Path('data/mechanics_localisation.json')
          loc = json.loads(lp.read_text())
          loc['version'] = max(int(loc.get('version', 0)), 16)
          vals = {
              'en': ('Lifesteal', 'Heal {basePercent}% ({upgradePercent}% if upgraded) from damage dealt.'),
              'zh-CN': ('吸血', '自身将恢复{basePercent}%对敌方所造成的直接伤害。(升级后提升至{upgradePercent}% )'),
              'zh-TW': ('吸血', '自身將恢復{basePercent}%對敵方所造成的直接傷害。 (升級後提升至{upgradePercent}% )')
          }
          for locale, (name, template) in vals.items():
              block = loc.setdefault('locales', {}).setdefault(locale, {})
              block.setdefault('terms', {})['mechanic.lifesteal'] = name
              block.setdefault('mechanicNames', {})['Lifesteal'] = name
              block.setdefault('templates', {})['lifesteal'] = template
          lp.write_text(json.dumps(loc, ensure_ascii=False, indent=2) + '\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mechanics.json data/mechanics_localisation.json
          git commit -m "Split Lifesteal from Steal mechanic"
          git push
