name: One-time snapshot copy from noagrp/j

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy source snapshot except workflow files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/noagrp/j.git source
          git clone "https://x-access-token:${GH_TOKEN}@github.com/Aubjective/j.git" target

          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/workflows/' \
            source/ target/

          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No snapshot changes to copy."
            exit 0
          fi
          git commit -m "Copy noagrp/j snapshot"
          git push origin main
